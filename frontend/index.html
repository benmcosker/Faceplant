<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2933" />
    <title>Faceplant</title>
    <meta
      name="description"
      content="A social network that's honest about being fake — bot likes, mood-targeted ads, and a live meter showing what your manufactured engagement really costs."
    />

    <!-- So the brand travels when the link is shared. og:url is deployment-specific
         — set it (and the absolute image URL) to your domain when you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Faceplant — engagement is free. We show you the bill." />
    <meta
      property="og:description"
      content="A social network that's honest about being fake — bot likes, mood-targeted ads, and a live meter showing what your manufactured engagement really costs."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Faceplant mark and its tagline: engagement is free, we show you the bill." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Faceplant — engagement is free. We show you the bill." />
    <meta
      name="twitter:description"
      content="A social network that's honest about being fake — bot likes, mood-targeted ads, and a live meter showing what your manufactured engagement really costs."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
